<template>
    <div class="step-line-editor slds-is-relative slds-p-around_medium">
        <!-- Loading Spinner -->
        <template lwc:if={isCalculating}>
            <lightning-spinner alternative-text="Calculating pricing..." size="medium" variant="brand"></lightning-spinner>
        </template>

        <!-- Empty State -->
        <template lwc:if={isEmpty}>
            <div class="slds-align_absolute-center slds-p-around_large">
                <c-empty-state
                    illustration-name="cart:noitems"
                    title="No Selected Products"
                    description="Add products to see them here."
                    size="large">
                </c-empty-state>
            </div>
        </template>

        <!-- Main Content -->
        <template lwc:if={isNotEmpty}>
            <!-- Line Items Tree Grid (Custom Blueprint) -->
            <div class="slds-table_edit_container slds-is-relative slds-m-bottom_medium slds-scrollable_x">
                <table aria-multiselectable="true"
                    class="slds-table slds-table_bordered slds-table_edit slds-table_fixed-layout slds-table_resizable-cols slds-tree slds-table_tree"
                    role="treegrid" aria-label="CPQ Line Editor Tree Grid">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th class="slds-cell_action-mode" scope="col" style="width:3.75rem">
                                <div class="slds-truncate slds-assistive-text" title="Errors">Errors</div>
                            </th>
                            <th class="slds-text-align_right slds-cell_action-mode" role="cell" style="width:3.25rem">
                                <div class="slds-th__action slds-th__action_form">
                                    <div class="slds-checkbox">
                                        <input type="checkbox" name="options" id="checkbox-all" tabindex="-1"
                                            aria-label="Select All" value="checkbox-all" />
                                        <label class="slds-checkbox__label" for="checkbox-all">
                                            <span class="slds-checkbox_faux"></span>
                                            <span class="slds-form-element__label slds-assistive-text">Select All</span>
                                        </label>
                                    </div>
                                </div>
                            </th>

                            <!-- Dynamic Columns -->
                            <template for:each={columns} for:item="col">
                                <th key={col.fieldName} aria-sort="none" class="slds-is-resizable slds-cell_action-mode" scope="col">
                                    <div class="slds-th__action slds-text-link_reset">
                                        <div class="slds-grid slds-grid_vertical-align-center slds-has-flexi-truncate">
                                            <span class="slds-truncate" title={col.label}>{col.label}</span>
                                        </div>
                                    </div>
                                    <div class="slds-resizable">
                                        <input aria-label={col.label} class="slds-resizable__input slds-assistive-text"
                                            max="1000" min="20" tabindex="-1" type="range" />
                                        <span class="slds-resizable__handle">
                                            <span class="slds-resizable__divider"></span>
                                        </span>
                                    </div>
                                </th>
                            </template>

                            <th class="slds-cell_action-mode" scope="col" style="width:3.25rem">
                                <div class="slds-truncate slds-assistive-text" title="Actions">Actions</div>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={flattenedData} for:item="row">
                            <tr key={row.rowId}
                                aria-level={row.ariaLevel}
                                aria-posinset={row.posInSet}
                                aria-setsize={row.setSize}
                                aria-expanded={row.isExpanded}
                                class={row.rowClass}
                                tabindex="0">

                                <!-- Error Cell -->
                                <td class="slds-cell-edit slds-cell-error slds-cell_action-mode" role="gridcell">
                                    <div class="slds-grid slds-grid_vertical-align-center">
                                        <span class="slds-row-number slds-text-body_small slds-text-color_weak slds-m-right_xx-small"></span>
                                        <template lwc:if={row._hasError}>
                                            <lightning-icon
                                                icon-name="utility:error"
                                                size="xx-small"
                                                variant="error"
                                                title={row._errorMessage}
                                                class="slds-m-left_xx-small error-icon">
                                            </lightning-icon>
                                        </template>
                                    </div>
                                </td>

                                <!-- Checkbox Cell -->
                                <td class="slds-text-align_right slds-cell_action-mode" role="gridcell">
                                    <template lwc:if={row.showCheckbox}>
                                        <div class="slds-checkbox">
                                            <input type="checkbox" name="options" id={row.rowId} aria-label={row.productName} />
                                            <label class="slds-checkbox__label" for={row.rowId}>
                                                <span class="slds-checkbox_faux"></span>
                                                <span class="slds-form-element__label slds-assistive-text">Select item</span>
                                            </label>
                                        </div>
                                    </template>
                                </td>

                                <!-- Product Column (Tree Column) -->
                                <th class="slds-tree__item slds-cell-edit slds-cell_action-mode" scope="row" data-label="Product" style={row.paddingStyle}>
                                    <button class="slds-button slds-button_icon slds-button_icon-x-small slds-m-right_x-small"
                                        onclick={handleToggleExpand} data-id={row.rowId} tabindex="-1"
                                        style={row.buttonStyle}>
                                        <lightning-icon icon-name={row.chevronClass} size="xx-small"></lightning-icon>
                                        <span class="slds-assistive-text">Toggle Expand</span>
                                    </button>
                                    <div class="slds-truncate" title={row.productName}>
                                        <span class="slds-grid slds-grid_align-spread">
                                            <span>{row.productName}</span>
                                        </span>
                                    </div>
                                </th>

                                <!-- Other Columns -->
                                <template for:each={columns} for:item="col">
                                    <template lwc:if={col.isProduct}>
                                        <!-- Skip as handled by the th product column -->
                                    </template>
                                    <template lwc:else>
                                        <td key={col.fieldName} data-label={col.label} role="gridcell" class="slds-cell-edit slds-cell_action-mode">
                                            <span class="slds-grid slds-grid_align-spread">
                                                <template lwc:if={col.editable}>
                                                    <!-- Quantity Field -->
                                                    <template lwc:if={col.isQty}>
                                                        <template lwc:if={row.isQtyEditable}>
                                                            <lightning-input type="number"
                                                                variant="label-hidden"
                                                                class="slds-text-align_right"
                                                                value={row.quantity}
                                                                data-id={row.rowId}
                                                                data-field="quantity"
                                                                onchange={handleInlineEdit}>
                                                            </lightning-input>
                                                        </template>
                                                        <template lwc:else>
                                                            <lightning-input type="number"
                                                                variant="label-hidden"
                                                                class="slds-text-align_right"
                                                                value={row.quantity}
                                                                disabled>
                                                            </lightning-input>
                                                        </template>
                                                    </template>

                                                    <!-- Discount Field -->
                                                    <template lwc:if={col.isDiscount}>
                                                        <template lwc:if={row.isDiscountEditable}>
                                                            <lightning-input type="number"
                                                                variant="label-hidden"
                                                                class="slds-text-align_right"
                                                                value={row.additionalDiscount}
                                                                data-id={row.rowId}
                                                                data-field="additionalDiscount"
                                                                onchange={handleInlineEdit}>
                                                            </lightning-input>
                                                        </template>
                                                        <template lwc:else>
                                                            <lightning-input type="number"
                                                                variant="label-hidden"
                                                                class="slds-text-align_right"
                                                                value={row.additionalDiscount}
                                                                formatter="percent-fixed"
                                                                disabled>
                                                            </lightning-input>
                                                        </template>
                                                    </template>
                                                </template>
                                                <template lwc:else>
                                                    <div class="slds-truncate slds-text-align_right slds-grow" title={row.formattedNetPrice} lwc:if={col.isCurrency}>
                                                        <template lwc:if={col.isListPrice}>{row.formattedListPrice}</template>
                                                        <template lwc:if={col.isNetPrice}>{row.formattedNetPrice}</template>
                                                        <template lwc:if={col.isTotal}>{row.formattedNetTotal}</template>
                                                    </div>
                                                    <div class="slds-truncate slds-grow" title={row.productCode} lwc:else>
                                                        {row.productCode}
                                                    </div>
                                                </template>
                                            </span>
                                        </td>
                                    </template>
                                </template>

                                <!-- Action Cell -->
                                <td role="gridcell" class="slds-cell_action-mode">
                                    <button class="slds-button slds-button_icon slds-button_icon-border-filled slds-button_icon-x-small"
                                        title={row.actionTitle}>
                                        <lightning-icon icon-name="utility:down" size="xx-small"></lightning-icon>
                                        <span class="slds-assistive-text">{row.actionTitle}</span>
                                    </button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <!-- Error Summary -->
            <template lwc:if={hasErrors}>
                <div class="slds-box slds-theme_error slds-m-bottom_medium">
                    <div class="slds-media slds-media_center">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="utility:error" size="small" variant="inverse"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <h3 class="slds-text-heading_small slds-text-color_inverse">Validation Errors</h3>
                            <ul class="slds-list_dotted slds-text-color_inverse">
                                <template for:each={errorMessages} for:item="msg">
                                    <li key={msg}>{msg}</li>
                                </template>
                            </ul>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Subtotal Footer -->
            <div class="slds-box slds-theme_shade">
                <div class="slds-grid slds-grid_align-end">
                    <div class="slds-col slds-text-align_right slds-text-title_caps slds-p-right_small">
                        Subtotal:
                        <span class="slds-text-align_right slds-text-title_bold">
                            {formattedSubtotal}
                        </span>
                    </div>
                </div>
            </div>
        </template>
    </div>
</template>
