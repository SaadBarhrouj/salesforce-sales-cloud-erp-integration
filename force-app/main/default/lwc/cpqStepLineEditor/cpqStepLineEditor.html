<template>
    <div class="step-line-editor slds-is-relative">
        <!-- Loading Spinner -->
        <div lwc:if={isCalculating} class="slds-backdrop slds-backdrop_open">
            <div class="slds-spinner_container slds-align_absolute-center">
                <div role="status" class="slds-spinner slds-spinner_large slds-spinner_brand">
                    <span class="slds-assistive-text">Loading</span>
                    <div class="slds-spinner__dot-a"></div>
                    <div class="slds-spinner__dot-b"></div>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div lwc:if={isEmpty} class="slds-align_absolute-center slds-p-around_large">
            <c-empty-state
                illustration-name="cart:noitems"
                title="No Selected Products"
                description="Go back to the selection step to add products."
                size="large">
            </c-empty-state>
        </div>

        <!-- Main Content -->
        <template lwc:if={isNotEmpty}>
            <!-- Bulk Actions Toolbar -->
            <div class="slds-m-bottom_medium slds-grid slds-grid_align-spread">
                <div class="slds-col">
                    <lightning-button-group>
                        <lightning-button
                            label="Apply Discount"
                            icon-name="utility:discount"
                            onclick={handleApplyBulkDiscount}>
                        </lightning-button>
                        <lightning-button
                            label="Refresh Pricing"
                            icon-name="utility:refresh"
                            onclick={handleRefreshPricing}>
                        </lightning-button>
                        <lightning-button
                            label="Validate All"
                            icon-name="utility:check"
                            onclick={handleValidateAll}>
                        </lightning-button>
                    </lightning-button-group>
                </div>
                <div class="slds-col slds-text-align_right">
                    <span class="slds-text-title_caps">Total Items: {totalItemCount}</span>
                </div>
            </div>

            <!-- Line Items Table -->
            <div class="slds-table_container">
                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_fixed-layout slds-max-medium-table_stacked">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col" style="width: 40px;"></th>
                            <th scope="col" style="width: 40px;">#</th>
                            <th scope="col" style="width: 140px;">Product Code</th>
                            <th scope="col">Product Name</th>
                            <th scope="col" style="width: 100px;">Quantity</th>
                            <th scope="col" style="width: 120px;" class="slds-text-align_right">List Price</th>
                            <th scope="col" style="width: 120px;">Disc. %</th>
                            <th scope="col" style="width: 120px;" class="slds-text-align_right">Net Price</th>
                            <th scope="col" style="width: 130px;" class="slds-text-align_right">Total</th>
                            <th scope="col" style="width: 60px;"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={numberedItems} for:item="item" for:index="idx">
                            <!-- Error Row -->
                            <tr key={item._errorKey} lwc:if={item._hasError} class="slds-theme_error">
                                <td colspan="10">
                                    <div class="slds-p-around_x-small slds-text-color_error">
                                        <lightning-icon icon-name="utility:error" size="small" class="slds-m-right_x-small"></lightning-icon>
                                        {item._errorMessage}
                                    </div>
                                </td>
                            </tr>

                            <!-- Main Line Item Row -->
                            <tr key={item._key} class="slds-hint-parent main-row" data-item-key={item._key}>
                                <td>
                                    <lightning-button-icon
                                        lwc:if={item.isBundle}
                                        icon-name={item._expandIcon}
                                        variant="bare"
                                        size="small"
                                        alternative-text={item._expandAltText}
                                        data-item-key={item._key}
                                        onclick={handleToggleExpand}>
                                    </lightning-button-icon>
                                </td>
                                <td data-label="#">
                                    <span class="slds-truncate" title={item._lineNumber}>{item._lineNumber}</span>
                                </td>
                                <td data-label="Product Code">
                                    <span class="slds-truncate slds-text-body_regular slds-text-title_bold" title={item.productCode}>
                                        {item.productCode}
                                    </span>
                                </td>
                                <td data-label="Product Name">
                                    <div class="slds-truncate">
                                        <span title={item.productName}>{item.productName}</span>
                                        <lightning-icon lwc:if={item.isBundle} icon-name="utility:package" size="xx-small" class="slds-m-left_xx-small" alternative-text="Bundle"></lightning-icon>
                                    </div>
                                </td>
                                <td data-label="Quantity">
                                    <lightning-input
                                        type="number"
                                        value={item.quantity}
                                        min="1"
                                        step="1"
                                        label="Quantity"
                                        variant="label-hidden"
                                        class="qty-input"
                                        data-item-key={item._key}
                                        data-field="quantity"
                                        onchange={handleLineChange}>
                                    </lightning-input>
                                </td>
                                <td data-label="List Price" class="slds-text-align_right">
                                    <lightning-formatted-number value={item.listUnitPrice} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                </td>
                                <td data-label="Discount %">
                                    <lightning-input
                                        type="number"
                                        value={item.additionalDiscount}
                                        min="0"
                                        max="100"
                                        step="0.01"
                                        label="Discount %"
                                        variant="label-hidden"
                                        formatter="percent-fixed"
                                        class="disc-input"
                                        data-item-key={item._key}
                                        data-field="additionalDiscount"
                                        onchange={handleLineChange}>
                                    </lightning-input>
                                </td>
                                <td data-label="Net Price" class="slds-text-align_right">
                                    <lightning-formatted-number value={item.netUnitPrice} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                </td>
                                <td data-label="Total" class="slds-text-align_right">
                                    <span class="slds-text-title_bold">
                                        <lightning-formatted-number value={item.netTotal} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                    </span>
                                </td>
                                <td class="slds-text-align_center">
                                    <lightning-button-menu
                                        icon-name="utility:actions"
                                        menu-alignment="auto"
                                        alternative-text="Line actions">
                                        <lightning-menu-item value="view" label="View Details" onclick={handleViewDetails}></lightning-menu-item>
                                        <lightning-menu-item value="remove" label="Remove" onclick={handleLineRemove}></lightning-menu-item>
                                    </lightning-button-menu>
                                </td>
                            </tr>

                            <!-- Bundle Options (Child Rows) -->
                            <template lwc:if={item._showOptions}>
                                <template for:each={item.options} for:item="opt">
                                    <tr key={opt._key} class="option-child-row slds-theme_shade">
                                        <td></td>
                                        <td></td>
                                        <td data-label="Option Code" class="slds-text-color_weak">
                                            <span class="slds-p-left_large slds-truncate" title={opt.productCode}>{opt.productCode}</span>
                                        </td>
                                        <td data-label="Option Name" class="slds-text-color_weak">
                                            <div class="slds-truncate">
                                                <lightning-icon icon-name="utility:connected_apps" size="x-small" class="slds-m-right_xx-small"></lightning-icon>
                                                <span title={opt.productName}>{opt.productName}</span>
                                            </div>
                                        </td>
                                        <td data-label="Quantity">
                                            <span class="slds-truncate">{opt.quantity}</span>
                                        </td>
                                        <td data-label="List Price" class="slds-text-align_right slds-text-color_weak">
                                            <lightning-formatted-number value={opt.listUnitPrice} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                        </td>
                                        <td data-label="Disc." class="slds-text-color_weak">—</td>
                                        <td data-label="Net Price" class="slds-text-align_right slds-text-color_weak">
                                            <lightning-formatted-number value={opt.netUnitPrice} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                        </td>
                                        <td data-label="Total" class="slds-text-align_right slds-text-color_weak">
                                            <lightning-formatted-number value={opt.netTotal} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                        </td>
                                        <td></td>
                                    </tr>
                                </template>
                            </template>
                        </template>
                    </tbody>
                    <tfoot>
                        <tr class="slds-theme_shade slds-text-title_bold">
                            <td colspan="8" class="slds-text-align_right slds-p-right_medium">Subtotal:</td>
                            <td class="slds-text-align_right slds-p-right_medium">
                                <lightning-formatted-number value={subtotal} format-style="currency" currency-code="USD"></lightning-formatted-number>
                            </td>
                            <td></td>
                        </tr>
                    </tfoot>
                </table>
            </div>

            <!-- Validation Errors Summary -->
            <div lwc:if={hasErrors} class="slds-m-top_medium slds-notify slds-notify_error" role="alert">
                <div class="slds-notify__content">
                    <h2 class="slds-text-heading_small">Pricing Errors ({errorCount})</h2>
                    <p>Please fix the errors above before proceeding.</p>
                </div>
            </div>
        </template>

        <!-- Navigation Footer -->
        <div class="slds-m-top_large slds-grid slds-grid_align-spread">
            <div>
                <lightning-button
                    label="Back"
                    icon-name="utility:back"
                    onclick={handleBack}>
                </lightning-button>
            </div>
            <div>
                <lightning-button
                    label="Next"
                    variant="brand"
                    icon-name="utility:forward"
                    icon-position="right"
                    disabled={isEmptyOrHasErrors}
                    onclick={handleNext}>
                </lightning-button>
            </div>
        </div>
    </div>
</template>
