<template>
    <div class="step-line-editor slds-is-relative slds-p-around_medium">
        <!-- Loading Spinner -->
        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text="Calculating pricing..." size="medium" variant="brand"></lightning-spinner>
        </template>

        <!-- Empty State -->
        <template lwc:if={isEmpty}>
            <div class="slds-align_absolute-center slds-p-around_large">
                <c-empty-state
                    illustration-name="cart:noitems"
                    title="No Selected Products"
                    description="Add products to see them here."
                    size="large">
                </c-empty-state>
            </div>
        </template>

        <!-- Main Content -->
        <template lwc:if={isNotEmpty}>
            <!-- Service Period Header (volume-pricing offers only) -->
            <template lwc:if={isVolumeOffer}>
                <div class="service-header slds-grid slds-gutters slds-m-bottom_small slds-p-around_x-small">
                    <div class="slds-col">
                        <lightning-input
                            type="date"
                            label="Service Start Date"
                            value={serviceStartDate}
                            data-field="serviceStartDate"
                            onchange={handleHeaderServiceChange}>
                        </lightning-input>
                    </div>
                    <div class="slds-col">
                        <lightning-input
                            type="date"
                            label="Service End Date"
                            value={serviceEndDate}
                            data-field="serviceEndDate"
                            onchange={handleHeaderServiceChange}>
                        </lightning-input>
                    </div>
                    <div class="slds-col">
                        <label class="slds-form-element__label">Days</label>
                        <div class="slds-form-element__control slds-text-heading_small slds-p-vertical_xxx-small">{headerDays}</div>
                    </div>
                </div>
            </template>

            <!-- Line Items Tree Grid (Custom Blueprint) -->
            <!-- No overflow:auto on the wrapper: the date picker popover from
                 lightning-input type="date" must be free to escape the table
                 container. -->
            <div class="slds-table_edit_container slds-is-relative slds-m-bottom_medium">
                <table aria-multiselectable="true"
                    class="slds-table slds-table_bordered slds-table_edit slds-table_fixed-layout slds-table_resizable-cols slds-tree slds-table_tree"
                    role="treegrid" aria-label="CPQ Line Editor Tree Grid">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th class="slds-cell_action-mode" scope="col" style="width:3.75rem">
                                <div class="slds-truncate slds-assistive-text" title="Errors">Errors</div>
                            </th>
                            <th class="slds-text-align_right slds-cell_action-mode" role="cell" style="width:3.25rem">
                                <div class="slds-th__action slds-th__action_form">
                                    <div class="slds-checkbox">
                                        <input type="checkbox" name="options" id="checkbox-all" tabindex="-1"
                                            aria-label="Select All" value="checkbox-all" onchange={handleSelectAll} />
                                        <label class="slds-checkbox__label" for="checkbox-all">
                                            <span class="slds-checkbox_faux"></span>
                                            <span class="slds-form-element__label slds-assistive-text">Select All</span>
                                        </label>
                                    </div>
                                </div>
                            </th>

                            <!-- Dynamic Columns -->
                            <template for:each={columns} for:item="col">
                                <th key={col.fieldName} aria-sort="none" class="slds-is-resizable slds-cell_action-mode" scope="col" style={col.style}>
                                    <div class="slds-th__action slds-text-link_reset">
                                        <div class="slds-grid slds-grid_vertical-align-center slds-has-flexi-truncate">
                                            <span class="slds-truncate" title={col.label}>{col.label}</span>
                                        </div>
                                    </div>
                                    <div class="slds-resizable">
                                        <input aria-label={col.label} class="slds-resizable__input slds-assistive-text"
                                            max="1000" min="20" tabindex="-1" type="range" />
                                        <span class="slds-resizable__handle">
                                            <span class="slds-resizable__divider"></span>
                                        </span>
                                    </div>
                                </th>
                            </template>

                            
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={flattenedData} for:item="row">
                            <tr key={row.rowId}
                                aria-level={row.ariaLevel}
                                aria-posinset={row.posInSet}
                                aria-setsize={row.setSize}
                                aria-expanded={row.isExpanded}
                                class={row.rowClass}
                                tabindex="0">

                                <!-- Error Cell -->
                                <td class="slds-cell-edit slds-cell-error slds-cell_action-mode" role="gridcell">
                                    <div class="slds-grid slds-grid_vertical-align-center">
                                        <template lwc:if={row._hasError}>
                                            <lightning-icon
                                                icon-name="utility:error"
                                                size="xx-small"
                                                variant="error"
                                                title={row._errorMessage}
                                                class="slds-m-left_xx-small error-icon">
                                            </lightning-icon>
                                        </template>
                                    </div>
                                </td>

                                <!-- Checkbox Cell -->
                                <td class="slds-text-align_right slds-cell_action-mode" role="gridcell">
                                    <template lwc:if={row.showCheckbox}>
                                        <div class="slds-checkbox">
                                            <input type="checkbox" name="options" id={row.rowId} aria-label={row.productName} checked={row.isSelected} onchange={handleRowSelect} data-id={row.rowId} />
                                            <label class="slds-checkbox__label" for={row.rowId}>
                                                <span class="slds-checkbox_faux"></span>
                                                <span class="slds-form-element__label slds-assistive-text">Select item</span>
                                            </label>
                                        </div>
                                    </template>
                                </td>

                                <!-- Product Column (Tree Column) -->
                                <th class="slds-tree__item slds-cell-edit slds-cell_action-mode" scope="row" data-label="Product" style={row.paddingStyle} title={row.productName}>
                                    <div class="slds-grid slds-grid_vertical-align-center product-cell-inner">
                                        <button class="slds-button slds-button_icon slds-button_icon-x-small slds-m-right_x-small"
                                            onclick={handleToggleExpand} data-id={row.rowId} tabindex="-1"
                                            style={row.buttonStyle}>
                                            <lightning-icon icon-name={row.chevronClass} size="xx-small"></lightning-icon>
                                            <span class="slds-assistive-text">Toggle Expand</span>
                                        </button>
                                        <span class="slds-truncate">{row.productName}</span>
                                    </div>
                                </th>

                                <!-- Other Columns -->
                                <template for:each={columns} for:item="col">
                                    <template lwc:if={col.isProduct}>
                                        <!-- Skip as handled by the th product column -->
                                    </template>
                                    <template lwc:else>
                                        <td key={col.fieldName} data-label={col.label} role="gridcell" class="slds-cell-edit slds-cell_action-mode">
                                            <span class="slds-grid slds-grid_align-end slds-grid_vertical-align-center slds-p-horizontal_x-small" style="height: 100%;">
                                                <template lwc:if={col.editable}>
                                                    <!-- Service Start Date Field -->
                                                    <template lwc:if={col.isStartDate}>
                                                        <lightning-input type="date"
                                                            variant="label-hidden"
                                                            value={row.serviceStartDate}
                                                            data-id={row.rowId}
                                                            data-field="serviceStartDate"
                                                            onchange={handleInlineEdit}>
                                                        </lightning-input>
                                                    </template>

                                                    <!-- Service End Date Field -->
                                                    <template lwc:if={col.isEndDate}>
                                                        <lightning-input type="date"
                                                            variant="label-hidden"
                                                            value={row.serviceEndDate}
                                                            data-id={row.rowId}
                                                            data-field="serviceEndDate"
                                                            onchange={handleInlineEdit}>
                                                        </lightning-input>
                                                    </template>

                                                    <!-- Quantity Field -->
                                                    <template lwc:if={col.isQty}>
                                                        <template lwc:if={row.isQtyEditable}>
                                                            <lightning-input type="number"
                                                                variant="label-hidden"
                                                                class="input-right-align"
                                                                value={row.quantity}
                                                                min={row.minQuantity}
                                                                max={row.maxQuantity}
                                                                step="1"
                                                                data-id={row.rowId}
                                                                data-field="quantity"
                                                                onchange={handleInlineEdit}>
                                                            </lightning-input>
                                                        </template>
                                                        <template lwc:else>
                                                            <span class="readonly-cell-value">{row.quantity}</span>
                                                        </template>
                                                    </template>

                                                    <!-- Discount Field -->
                                                    <template lwc:if={col.isDiscount}>
                                                        <template lwc:if={row.isDiscountEditable}>
                                                            <lightning-input type="number"
                                                                variant="label-hidden"
                                                                class="input-right-align"
                                                                value={row.additionalDiscount}
                                                                data-id={row.rowId}
                                                                data-field="additionalDiscount"
                                                                onchange={handleInlineEdit}>
                                                            </lightning-input>
                                                        </template>
                                                        <template lwc:else>
                                                            <lightning-input type="number"
                                                                variant="label-hidden"
                                                                class="input-right-align"
                                                                value={row.additionalDiscount}
                                                                formatter="percent-fixed"
                                                                disabled>
                                                            </lightning-input>
                                                        </template>
                                                    </template>
                                                </template>
                                                <template lwc:else>
                                                    <template lwc:if={col.isCurrency}>
                                                        <div class="slds-truncate" title={row.formattedNetPrice}>
                                                            <template lwc:if={col.isListPrice}>{row.formattedListPrice}</template>
                                                            <template lwc:if={col.isNetPrice}>{row.formattedNetPrice}</template>
                                                            <template lwc:if={col.isTotal}>{row.formattedNetTotal}</template>
                                                            <template lwc:if={col.isDailyRate}>{row.formattedDailyRate}</template>
                                                        </div>
                                                    </template>
                                                    <template lwc:else>
                                                        <div class="slds-truncate" title={row.productCode}>
                                                            {row.productCode}
                                                        </div>
                                                    </template>
                                                </template>
                                            </span>
                                        </td>
                                    </template>
                                </template>


                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <!-- Subtotal Footer -->
            <div class="slds-grid slds-grid_align-end slds-m-top_xx-small slds-p-right_small">
                <span class="slds-text-title_caps">Subtotal:</span>
                <template lwc:if={subtotalLoading}>
                    <span class="slds-text-title_bold slds-m-left_xx-small slds-text-color_weak">Calculating...</span>
                </template>
                <template lwc:else>
                    <span class="slds-text-title_bold slds-m-left_xx-small">{formattedSubtotal}</span>
                </template>
            </div>
        </template>
    </div>
</template>
