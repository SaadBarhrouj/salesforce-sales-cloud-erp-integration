<template>
    <!-- LOADING STATE -->
    <template lwc:if={isLoading}>
        <lightning-card title="Trip Map" icon-name="utility:location">
            <div class="state-container">
                <lightning-spinner alternative-text="Loading trip data…" size="medium">
                </lightning-spinner>
            </div>
        </lightning-card>
    </template>

    <!-- ERROR STATE -->
    <template lwc:elseif={hasError}>
        <lightning-card title="Trip Map" icon-name="utility:location">
            <div class="state-container">
                <lightning-icon icon-name="utility:error" size="large" variant="error">
                </lightning-icon>
                <p class="state-heading slds-text-color_error">Loading Error</p>
                <p class="state-subtext">Unable to retrieve trip data.</p>
            </div>
        </lightning-card>
    </template>

    <!-- INCOMPLETE COORDINATES -->
    <template lwc:elseif={isIncomplete}>
        <lightning-card title="Trip Map" icon-name="utility:location">
            <div class="state-container">
                <div class="empty-icon-ring">
                    <lightning-icon icon-name="utility:routing" size="large"></lightning-icon>
                </div>
                <p class="state-heading">Route Not Available</p>
                <p class="state-subtext">
                    Both locations must have GPS coordinates to display the route map.
                </p>
            </div>
        </lightning-card>
    </template>

    <!-- MAP READY -->
    <template lwc:else>
        <lightning-card title="Trip Map" icon-name="utility:location">

            <!-- Leaflet map container -->
            <div class="map-wrapper">
                <div class="map-container" style={mapContainerStyle}>
                    <div class="leaflet-map" lwc:ref="leafletMap" lwc:dom="manual"></div>
                </div>
            </div>

            <!-- Route summary panel below map -->
            <template lwc:if={showRoutePanel}>
                <div class="route-panel">
                    <div class="route-visual">
                        <div class="dot dot--departure"></div>
                        <div class="line-track">
                            <div class="line"></div>
                        </div>
                        <div class="dot dot--destination"></div>
                    </div>
                    <div class="route-labels">
                        <span class="route-name route-name--left" title={departureName}>
                            {departureName}
                        </span>
                        <div class="route-center">
                            <span class="route-distance">{formattedDistance}</span>
                            <template lwc:if={formattedDuration}>
                                <span class="route-duration">{formattedDuration}</span>
                            </template>
                            <template lwc:if={direction}>
                                <span class="route-direction">{direction}</span>
                            </template>
                        </div>
                        <span class="route-name route-name--right" title={destinationName}>
                            {destinationName}
                        </span>
                    </div>
                </div>
            </template>

            <!-- Legend -->
            <div class="legend-panel">
                <span class="legend-item">
                    <span class="legend-dot legend-dot--warehouse"></span> Warehouse / Agency
                </span>
                <span class="legend-item">
                    <span class="legend-dot legend-dot--site"></span> Customer / Site
                </span>
            </div>
        </lightning-card>
    </template>
</template>
