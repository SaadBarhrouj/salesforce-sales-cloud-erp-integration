<template>
    <div class="modal-wrapper">
        <template lwc:if={recordId}>
            <template lwc:if={isLoading}>
                <div class="spinner-container">
                    <lightning-spinner
                        alternative-text="Saving PDF"
                        size="large">
                    </lightning-spinner>
                </div>
            </template>

            <template lwc:if={hasError}>
                <div class="spinner-container">
                    <div class="slds-text-align_center">
                        <p class="slds-text-color_error slds-p-bottom_medium">{errorMessage}</p>
                        <lightning-button
                            variant="neutral"
                            label="Close"
                            onclick={handleClose}>
                        </lightning-button>
                    </div>
                </div>
            </template>

            <template lwc:if={isNotSaving}>
                <iframe
                    src={pdfUrl}
                    class="pdf-iframe"
                    onload={handleIframeLoad}>
                </iframe>

                <div class="footer-bar">
                    <lightning-button
                        variant="neutral"
                        label="Cancel"
                        onclick={handleClose}>
                    </lightning-button>
                    <lightning-button
                        variant="brand"
                        label="Save"
                        onclick={handleSave}>
                    </lightning-button>
                </div>
            </template>
        </template>

        <template lwc:else>
            <div class="spinner-container">
                <div class="slds-text-align_center">
                    <p class="slds-text-color_error slds-p-bottom_medium">
                        No Quote record context. Open this action from a Quote record page.
                    </p>
                    <lightning-button
                        variant="neutral"
                        label="Close"
                        onclick={handleClose}>
                    </lightning-button>
                </div>
            </div>
        </template>
    </div>
</template>
