<template>
    <div class="slds-card slds-p-around_medium core-container">
        <lightning-layout multiple-rows>
                <lightning-layout-item size="12" padding="around-small">
                    
                    <!-- SECTION 1: ROUTE SETTINGS -->
                    <div class="slds-box slds-theme_default slds-m-bottom_medium">
                        <h3 class="slds-text-heading_small slds-m-bottom_medium">Route Settings</h3>
                        
                        <lightning-layout>
                            <lightning-layout-item size="6" class="slds-p-right_x-small">
                                <lightning-combobox
                                    label="Urgency"
                                    value={config.urgency}
                                    options={urgencyOptions}
                                    onchange={handleConfigChange}
                                    data-field="urgency"
                                    class="slds-m-bottom_small"
                                ></lightning-combobox>
                            </lightning-layout-item>
                        </lightning-layout>
                    </div>

                    <!-- SECTION 2: CALCULATED TRIPS -->
                    <template lwc:if={hasTrips}>
                        <div class="slds-box slds-theme_shade slds-m-bottom_medium" style="position: relative;">
                            <template lwc:if={isCalculating}>
                                <lightning-spinner alternative-text="Calculating..." size="medium"></lightning-spinner>
                            </template>
                            
                            <h3 class="slds-text-heading_small slds-m-bottom_medium">
                                Generated Trips
                                <span class="slds-badge slds-m-left_small">{trips.length}</span>
                            </h3>
                            
                            <!-- Help Text for Override Reason -->
                            <div class="slds-p-bottom_small slds-text-color_weak slds-text-body_small">
                                <lightning-icon
                                    icon-name="utility:info"
                                    size="xx-small"
                                    alternative-text="Info"
                                    style="vertical-align: middle; margin-right: 0.25rem;"
                                ></lightning-icon>
                                Override Reason is required when you modify the Final Price
                            </div>
                            
                            <lightning-datatable
                                key-field="Id"
                                data={trips}
                                columns={tripColumns}
                                max-row-selection="1"
                                hide-checkbox-column
                                onsave={handleSave}>
                            </lightning-datatable>
                        </div>
                    </template>
                    
                    <!-- EMPTY STATE FOR TRIPS -->
                    <template lwc:elseif={showEmptyState}>
                        <div class="slds-align_absolute-center slds-m-top_xx-large slds-p-around_large text-center-width">
                            <c-empty-state
                                illustration-name={emptyStateIllustration}
                                title="No Routes Calculated"
                                description="Loading transport costs...">
                            </c-empty-state>
                        </div>
                    </template>

                </lightning-layout-item>
            </lightning-layout>
    </div>
</template>
