<template>
    <div class="slds-card slds-p-around_medium">
        <h2 class="slds-text-heading_medium slds-m-bottom_medium">Transport & Logistics</h2>

        <lightning-layout multiple-rows>
            <!-- Transport Required -->
            <lightning-layout-item size="12" padding="around-small">
                <lightning-input
                    type="toggle"
                    label="Transport Required"
                    checked={transportRequired}
                    message-toggle-active="Yes"
                    message-toggle-inactive="No"
                    onchange={handleTransportToggle}
                ></lightning-input>
            </lightning-layout-item>

            <template lwc:if={transportRequired}>
                <!-- Delivery Site -->
                <lightning-layout-item size="12" medium-device-size="6" padding="around-small">
                    <lightning-combobox
                        label="Delivery Site"
                        value={deliverySiteId}
                        options={locationOptions}
                        placeholder="Select delivery location"
                        required
                        onchange={handleDeliverySiteChange}
                    ></lightning-combobox>
                </lightning-layout-item>

                <!-- Departure Agency -->
                <lightning-layout-item size="12" medium-device-size="6" padding="around-small">
                    <lightning-combobox
                        label="Departure Agency"
                        value={agencyId}
                        options={agencyOptions}
                        placeholder="Select departure agency"
                        required
                        onchange={handleAgencyChange}
                    ></lightning-combobox>
                </lightning-layout-item>

                <!-- Urgency -->
                <lightning-layout-item size="12" medium-device-size="6" padding="around-small">
                    <lightning-combobox
                        label="Transport Urgency"
                        value={urgency}
                        options={urgencyOptions}
                        onchange={handleUrgencyChange}
                    ></lightning-combobox>
                </lightning-layout-item>

                <!-- Estimated Weight -->
                <lightning-layout-item size="12" medium-device-size="6" padding="around-small">
                    <div class="slds-form-element">
                        <label class="slds-form-element__label">Estimated Total Weight</label>
                        <div class="slds-form-element__control">
                            <span class="slds-text-heading_small">{formattedWeight} kg</span>
                        </div>
                    </div>
                </lightning-layout-item>
            </template>

            <!-- Notes -->
            <lightning-layout-item size="12" padding="around-small">
                <lightning-textarea
                    label="Logistics Notes"
                    value={notes}
                    max-length="2000"
                    placeholder="Special delivery instructions, contact info, access codes..."
                    onchange={handleNotesChange}
                ></lightning-textarea>
            </lightning-layout-item>
        </lightning-layout>

        <!-- Quote Summary -->
        <div class="slds-m-top_large slds-box slds-theme_shade slds-p-around_medium">
            <h3 class="slds-text-heading_small slds-m-bottom_small">Quote Summary</h3>
            <lightning-layout>
                <lightning-layout-item size="3">
                    <dl>
                        <dt class="slds-text-title_caps">Account</dt>
                        <dd class="slds-text-body_regular">{quoteState.accountName}</dd>
                    </dl>
                </lightning-layout-item>
                <lightning-layout-item size="3">
                    <dl>
                        <dt class="slds-text-title_caps">Catalog</dt>
                        <dd class="slds-text-body_regular">{quoteState.catalogName}</dd>
                    </dl>
                </lightning-layout-item>
                <lightning-layout-item size="3">
                    <dl>
                        <dt class="slds-text-title_caps">Products</dt>
                        <dd class="slds-text-body_regular">{itemCount} items</dd>
                    </dl>
                </lightning-layout-item>
                <lightning-layout-item size="3">
                    <dl>
                        <dt class="slds-text-title_caps">Subtotal</dt>
                        <dd class="slds-text-heading_small">{formattedSubtotal}</dd>
                    </dl>
                </lightning-layout-item>
            </lightning-layout>
        </div>

        <!-- Navigation -->
        <div class="slds-m-top_large slds-clearfix">
            <lightning-button
                label="Back: Lines"
                icon-name="utility:back"
                class="slds-float_left"
                onclick={handleBack}
            ></lightning-button>
            <lightning-button
                label="Next: Review"
                variant="brand"
                icon-name="utility:forward"
                icon-position="right"
                class="slds-float_right"
                onclick={handleNext}
            ></lightning-button>
        </div>
    </div>
</template>
