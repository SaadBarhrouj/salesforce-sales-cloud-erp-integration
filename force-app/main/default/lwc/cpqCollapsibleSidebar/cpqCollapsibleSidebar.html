<template>
    <div class={sidebarClass} role="complementary">
        <div class="sidebar-header slds-p-around_x-small slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
            <span class="slds-text-title_caps" lwc:if={isExpanded}>{title}</span>
            <lightning-button-icon
                icon-name={toggleIcon}
                variant="bare"
                size="medium"
                alternative-text={toggleLabel}
                title={toggleLabel}
                onclick={handleToggle}
            ></lightning-button-icon>
        </div>
        <div class="sidebar-body" lwc:if={isExpanded}>
            <ul class="slds-listbox slds-listbox_vertical" role="listbox">
                <template for:each={items} for:item="item">
                    <li key={item.id}
                        class={item.itemClass}
                        role="option"
                        aria-selected={item.isActive}
                        data-id={item.id}
                        onclick={handleItemClick}
                    >
                        <div class="slds-grid slds-grid_vertical-align-center slds-p-horizontal_small slds-p-vertical_xx-small">
                            <div class="slds-col slds-grow">
                                <span class="slds-truncate" title={item.label}>{item.label}</span>
                                <span class="slds-text-body_small slds-text-color_weak" lwc:if={item.subtitle}>{item.subtitle}</span>
                            </div>
                            <div class="slds-col slds-shrink-none" lwc:if={item.badge}>
                                <span class={item.badgeClass}>{item.badge}</span>
                            </div>
                        </div>
                    </li>
                </template>
            </ul>
        </div>
    </div>
</template>
