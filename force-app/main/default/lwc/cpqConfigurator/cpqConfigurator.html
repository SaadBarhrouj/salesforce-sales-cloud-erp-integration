<template>
    <div class="cpq-app-wrapper">
        <!-- Page Header -->
        <c-cpq-sticky-header
            top-label={headerTopLabel}
            title={headerTitle}
            subtitle={headerSubtitle}
            icon-name={headerIcon}
            step-actions={headerStepActions}
            global-actions={headerGlobalActions}
            metadata-items={headerMetadata}
            show-search={headerShowSearch}
            search-placeholder={headerSearchPlaceholder}
            onheaderaction={handleHeaderAction}
            onheadersearch={handleHeaderSearch}
        ></c-cpq-sticky-header>

        <!-- BODY: Two-column layout -->
        <div class="cpq-app-body" data-has-sidebar={showSidebar}>
            <!-- LEFT COLUMN: Split View Sidebar -->
            <template lwc:if={showSidebar}>
                <c-cpq-collapsible-sidebar
                    title={sidebarTitle}
                    icon-name={sidebarIcon}
                    sort-label={sidebarSortLabel}
                    sort-field={sidebarSortField}
                    sort-direction={sidebarSortDirection}
                    items={sidebarItems}
                    selected-item-id={selectedItemId}
                    is-loading={sidebarIsLoading}
                    onitemselect={handleItemSelect}
                    onitemdeselect={handleItemDeselect}
                    onsidebarrefresh={handleSidebarRefresh}
                    onsortchange={handleSortChange}
                ></c-cpq-collapsible-sidebar>
            </template>

            <!-- RIGHT COLUMN: Main content  -->
            <main class="cpq-app-main">
                    <!-- Step 1: Product Selection (Main View) -->
                    <template lwc:if={isStepSelection}>
                        <c-cpq-step-selection
                            category-id={selectedItemId}
                            category-label={selectedItemLabel}
                            pricebook-id={opportunityPricebookId}
                            catalog-id={opportunityCatalogId}
                            selected-products={selectedProducts}
                            onproductadd={handleProductAdd}
                            onproductremove={handleProductRemove}
                            onnavigate={handleNavigate}
                            onitemdeselect={handleItemDeselect}
                        ></c-cpq-step-selection>
                    </template>

                    <!-- Step 2: Bundle Configurator -->
                    <template lwc:if={isStepConfigure}>
                        <c-cpq-step-bundle-config
                            item-key={selectedItemId}
                            bundle-id={selectedBundleProductId}
                            cached-features={selectedBundleCachedFeatures}
                            onbundlesave={handleBundleConfigSaved}
                        ></c-cpq-step-bundle-config>
                    </template>

                    <!-- Step 3: Line Editor -->
                    <template lwc:if={isStepLineEditor}>
                        <c-cpq-step-line-editor
                            selected-products={selectedProducts}
                            pricebook-id={opportunityPricebookId}
                            offer-type={opportunityOfferType}
                            onproductchange={handleLineProductChange}
                            onlineremove={handleLineRemove}
                            onnavigate={handleNavigate}
                            onselectionchange={handleLineSelectionChange}
                        ></c-cpq-step-line-editor>
                    </template>

                    <!-- Step 4: Logistics -->
                    <template lwc:if={isStepLogistics}>
                        <c-cpq-step-logistics
                            opportunity-id={recordId}
                            account-locations={mockAccountLocations}
                            agencies={mockAgencies}
                            total-weight="250"
                            onlogisticschange={handleLogisticsChange}
                        ></c-cpq-step-logistics>
                    </template>

                    <!-- Step 5: Review & Save -->
                    <template lwc:if={isStepReview}>
                        <c-cpq-step-review
                            selected-products={selectedProducts}
                            quote-state={quoteState}
                            logistics-state={logisticsState}
                            onsavequote={handleSaveQuote}
                            onnavigate={handleNavigate}
                        ></c-cpq-step-review>
                    </template>
            </main>
        </div>
    </div>
</template>
