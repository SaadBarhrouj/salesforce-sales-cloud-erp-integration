<template>
    <div class="review-container">

        <!-- ═══ Section 1: Opportunity Details ═══ -->
        <div class="slds-card slds-m-bottom_medium">
            <div class="slds-card__header slds-grid">
                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                    <div class="slds-media__figure">
                        <lightning-icon icon-name="standard:opportunity" size="small"></lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <h2 class="slds-card__header-title slds-text-heading_small">Opportunity Details</h2>
                    </div>
                </header>
            </div>
            <div class="slds-card__body slds-card__body_inner">
                <lightning-layout multiple-rows>
                    <lightning-layout-item size="6" small-device-size="12" padding="horizontal-small">
                        <dl class="slds-dl_horizontal slds-dl_horizontal_small">
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Opportunity</dt>
                            <dd class="slds-dl_horizontal__detail slds-text-title_bold">{opportunityName}</dd>
                            
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Account</dt>
                            <dd class="slds-dl_horizontal__detail">{accountName}</dd>
                        </dl>
                    </lightning-layout-item>
                    <lightning-layout-item size="6" small-device-size="12" padding="horizontal-small">
                        <dl class="slds-dl_horizontal slds-dl_horizontal_small">
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Pricebook</dt>
                            <dd class="slds-dl_horizontal__detail">{pricebookName}</dd>
                            
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Offer Type</dt>
                            <dd class="slds-dl_horizontal__detail">{offerTypeName}</dd>
                        </dl>
                    </lightning-layout-item>
                </lightning-layout>
            </div>
        </div>

        <!-- ═══ Section 2: Products & Line Items ═══ -->
        <div class="slds-card slds-m-bottom_medium">
            <div class="slds-card__header slds-grid">
                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                    <div class="slds-media__figure">
                        <lightning-icon icon-name="standard:product" size="small"></lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <h2 class="slds-card__header-title slds-text-heading_small">
                            Products ({itemCount})
                        </h2>
                    </div>
                </header>
            </div>
            <div class="slds-card__body">
                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped slds-tree slds-table_tree"
                       role="treegrid" aria-label="Opportunity Line Items">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col" style="width:40px;">#</th>
                            <th scope="col">Product</th>
                            <th scope="col" style="width:100px;">Code</th>
                            <th scope="col" style="width:70px;" class="slds-text-align_center">Qty</th>
                            <th scope="col" style="width:110px;" class="slds-text-align_right">List Price</th>
                            <th scope="col" style="width:80px;" class="slds-text-align_right">Disc.%</th>
                            <th scope="col" style="width:110px;" class="slds-text-align_right">Net Price</th>
                            <th scope="col" style="width:120px;" class="slds-text-align_right">Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={flattenedLineItems} for:item="row">
                            <tr key={row._key} class={row.rowClass} aria-level={row.ariaLevel}>
                                <td>{row.lineNumber}</td>
                                <th scope="row" class="slds-tree__item" style={row.paddingStyle}>
                                    <div class="slds-grid slds-grid_vertical-align-center">
                                        <button lwc:if={row.hasOptions}
                                                class="slds-button slds-button_icon slds-button_icon-x-small slds-m-right_x-small"
                                                onclick={handleToggleExpand}
                                                data-id={row.parentKey}
                                                style={row.buttonVisibility}
                                                tabindex="-1">
                                            <lightning-icon icon-name={row.chevronIcon} size="xx-small"></lightning-icon>
                                        </button>
                                        <span class="slds-truncate" title={row.productName}>{row.productName}</span>
                                    </div>
                                </th>
                                <td><span class="slds-text-body_small">{row.productCode}</span></td>
                                <td class="slds-text-align_center">{row.quantity}</td>
                                <td class="slds-text-align_right">{row.formattedListPrice}</td>
                                <td class="slds-text-align_right">{row.formattedDiscount}</td>
                                <td class="slds-text-align_right">{row.formattedNetPrice}</td>
                                <td class="slds-text-align_right slds-text-title_bold">{row.formattedTotal}</td>
                            </tr>
                        </template>
                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="7" class="slds-text-align_right slds-text-title_caps slds-p-right_small">Subtotal</td>
                            <td class="slds-text-align_right slds-text-heading_small">{formattedSubtotal}</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>

        <!-- ═══ Section 3: Logistics ═══ -->
        <div class="slds-card slds-m-bottom_medium">
            <div class="slds-card__header slds-grid">
                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                    <div class="slds-media__figure">
                        <lightning-icon icon-name="standard:shipment" size="small"></lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <h2 class="slds-card__header-title slds-text-heading_small">Logistics</h2>
                    </div>
                </header>
            </div>
            <div class="slds-card__body slds-card__body_inner">
                <lightning-layout multiple-rows>
                    <lightning-layout-item size="6" small-device-size="12" padding="horizontal-small">
                        <dl class="slds-dl_horizontal slds-dl_horizontal_small">
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Transport Required</dt>
                            <dd class="slds-dl_horizontal__detail">{transportDisplay}</dd>
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Delivery Site</dt>
                            <dd class="slds-dl_horizontal__detail">{deliverySiteDisplay}</dd>
                        </dl>
                    </lightning-layout-item>
                    <lightning-layout-item size="6" small-device-size="12" padding="horizontal-small">
                        <dl class="slds-dl_horizontal slds-dl_horizontal_small">
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Transport Agency</dt>
                            <dd class="slds-dl_horizontal__detail">{agencyDisplay}</dd>
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Urgency</dt>
                            <dd class="slds-dl_horizontal__detail">{urgencyDisplay}</dd>
                        </dl>
                    </lightning-layout-item>
                    <lightning-layout-item lwc:if={hasNotes} size="12" padding="horizontal-small" class="slds-m-top_x-small">
                        <dl class="slds-dl_horizontal slds-dl_horizontal_small">
                            <dt class="slds-dl_horizontal__label slds-text-color_weak">Notes</dt>
                            <dd class="slds-dl_horizontal__detail">{logisticsState.notes}</dd>
                        </dl>
                    </lightning-layout-item>
                </lightning-layout>
            </div>
        </div>

        <!-- ═══ Section 4: Opportunity Summary ═══ -->
        <div class="slds-card total-card slds-m-bottom_medium">
            <div class="slds-card__body slds-card__body_inner">
                <lightning-layout vertical-align="center" multiple-rows>
                    <lightning-layout-item flexibility="grow" size="6" medium-device-size="3" class="slds-text-align_center slds-m-bottom_small">
                        <div class="slds-grid slds-grid_vertical">
                            <span class="slds-text-title_caps slds-text-color_weak">Total Products</span>
                            <span class="slds-text-heading_small">{itemCount}</span>
                        </div>
                    </lightning-layout-item>
                    <lightning-layout-item flexibility="grow" size="6" medium-device-size="3" class="slds-text-align_center slds-m-bottom_small">
                        <div class="slds-grid slds-grid_vertical">
                            <span class="slds-text-title_caps slds-text-color_weak">Total Items</span>
                            <span class="slds-text-heading_small">{totalLineItems}</span>
                        </div>
                    </lightning-layout-item>
                    <lightning-layout-item flexibility="grow" size="6" medium-device-size="3" class="slds-text-align_center slds-m-bottom_small">
                        <div class="slds-grid slds-grid_vertical">
                            <span class="slds-text-title_caps slds-text-color_weak">Est. Weight</span>
                            <span class="slds-text-heading_small">{formattedWeight} kg</span>
                        </div>
                    </lightning-layout-item>
                    <lightning-layout-item flexibility="grow" size="6" medium-device-size="3" class="slds-text-align_right">
                        <div class="slds-grid slds-grid_vertical">
                            <span class="slds-text-title_caps slds-text-color_weak">Grand Total</span>
                            <span class="slds-text-heading_medium grand-total">{formattedSubtotal}</span>
                        </div>
                    </lightning-layout-item>
                </lightning-layout>
            </div>
        </div>
    </div>
</template>
