<template>
    <div class="review-container">

        <!-- ═══ Section 1: Opportunity Details ═══ -->
        <div class="slds-card slds-m-bottom_medium">
            <div class="slds-card__header slds-grid">
                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                    <div class="slds-media__figure">
                        <lightning-icon icon-name="standard:opportunity" size="small"></lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <h2 class="slds-card__header-title slds-text-heading_small">Opportunity Details</h2>
                    </div>
                </header>
            </div>
            <div class="slds-card__body slds-card__body_inner">
                <div class="info-grid">
                    <div class="info-row slds-m-bottom_x-small">
                        <span class="slds-text-color_weak label-col">Opportunity:</span>
                        <span class="slds-text-title_bold value-col">{opportunityName}</span>
                    </div>
                    <div class="info-row slds-m-bottom_x-small">
                        <span class="slds-text-color_weak label-col">Account:</span>
                        <span class="value-col">{accountName}</span>
                    </div>
                    <div class="info-row slds-m-bottom_x-small">
                        <span class="slds-text-color_weak label-col">Pricebook:</span>
                        <span class="value-col">{pricebookName}</span>
                    </div>
                    <div class="info-row slds-m-bottom_x-small">
                        <span class="slds-text-color_weak label-col">Offer Type:</span>
                        <span class="value-col">{offerTypeName}</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ═══ Section 2: Products & Line Items ═══ -->
        <div class="slds-card slds-m-bottom_medium">
            <div class="slds-card__header slds-grid">
                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                    <div class="slds-media__figure">
                        <lightning-icon icon-name="standard:product" size="small"></lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <h2 class="slds-card__header-title slds-text-heading_small">
                            Products ({itemCount})
                        </h2>
                    </div>
                </header>
            </div>
            <div class="slds-card__body">
                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped slds-tree slds-table_tree"
                       role="treegrid" aria-label="Opportunity Line Items">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col" style="width:40px;">#</th>
                            <th scope="col">Product</th>
                            <th scope="col" style="width:100px;">Code</th>
                            <th scope="col" style="width:70px;" class="slds-text-align_center">Qty</th>
                            <th scope="col" style="width:110px;" class="slds-text-align_right">List Price</th>
                            <th scope="col" style="width:80px;" class="slds-text-align_right">Disc.%</th>
                            <th scope="col" style="width:110px;" class="slds-text-align_right">Net Price</th>
                            <th scope="col" style="width:120px;" class="slds-text-align_right">Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={flattenedLineItems} for:item="row">
                            <tr key={row._key} class={row.rowClass} aria-level={row.ariaLevel}>
                                <td class="slds-cell-edit slds-cell_action-mode">{row.lineNumber}</td>
                                <th scope="row" class="slds-tree__item slds-cell-edit slds-cell_action-mode" style={row.paddingStyle} title={row.productName}>
                                    <div class="slds-grid slds-grid_vertical-align-center product-cell-inner">
                                        <button lwc:if={row.hasOptions}
                                                class="slds-button slds-button_icon slds-button_icon-x-small slds-m-right_x-small"
                                                onclick={handleToggleExpand}
                                                data-id={row.parentKey}
                                                style={row.buttonVisibility}
                                                tabindex="-1">
                                            <lightning-icon icon-name={row.chevronIcon} size="xx-small"></lightning-icon>
                                        </button>
                                        <span class="slds-truncate"><a href="javascript:void(0)" onclick={handleProductLinkClick} data-id={row.productId}>{row.productName}</a></span>
                                    </div>
                                </th>
                                <td class="slds-cell-edit slds-cell_action-mode"><span class="slds-text-body_small slds-truncate">{row.productCode}</span></td>
                                <td class="slds-text-align_center slds-cell-edit slds-cell_action-mode">{row.quantity}</td>
                                <td class="slds-text-align_right slds-cell-edit slds-cell_action-mode">{row.formattedListPrice}</td>
                                <td class="slds-text-align_right slds-cell-edit slds-cell_action-mode">{row.formattedDiscount}</td>
                                <td class="slds-text-align_right slds-cell-edit slds-cell_action-mode">{row.formattedNetPrice}</td>
                                <td class="slds-text-align_right slds-text-title_bold slds-cell-edit slds-cell_action-mode">{row.formattedTotal}</td>
                            </tr>
                        </template>
                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="7" class="slds-text-align_right slds-text-title_caps slds-p-right_small">Subtotal</td>
                            <td class="slds-text-align_right slds-text-heading_small">{formattedSubtotal}</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>

        <!-- ═══ Section 3: Logistics ═══ -->
        <template lwc:if={isTransportRequired}>
            <div class="slds-card slds-m-bottom_medium">
                <div class="slds-card__header slds-grid">
                    <header class="slds-media slds-media_center slds-has-flexi-truncate">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="custom:custom98" size="small"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <h2 class="slds-card__header-title slds-text-heading_small">Logistics</h2>
                        </div>
                    </header>
                </div>
                <div class="slds-card__body slds-card__body_inner">
                    <div class="info-grid">
                        <div class="info-row slds-m-bottom_x-small">
                            <span class="slds-text-color_weak label-col">Transport Required:</span>
                            <span class="value-col">{transportDisplay}</span>
                        </div>
                        <div class="info-row slds-m-bottom_x-small">
                            <span class="slds-text-color_weak label-col">Agency:</span>
                            <span class="value-col">{agencyDisplay}</span>
                        </div>
                        <div class="info-row slds-m-bottom_x-small">
                            <span class="slds-text-color_weak label-col">Urgency:</span>
                            <span class="value-col">{urgencyDisplay}</span>
                        </div>
                        <div class="info-row slds-m-bottom_x-small">
                            <span class="slds-text-color_weak label-col">Delivery Site:</span>
                            <span class="value-col">{deliverySiteDisplay}</span>
                        </div>
                        <template lwc:if={hasNotes}>
                            <div class="info-row">
                                <span class="slds-text-color_weak label-col">Notes:</span>
                                <span class="value-col">{logisticsState.notes}</span>
                            </div>
                        </template>
                    </div>

                    <!-- Trips Table -->
                    <template lwc:if={hasTrips}>
                        <h3 class="slds-text-title_bold slds-m-bottom_small">Trips</h3>
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped"
                                aria-label="Transport Trips">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th scope="col" style="width:50px;">#</th>
                                    <th scope="col">Truck Type</th>
                                    <th scope="col" style="width:120px;" class="slds-text-align_right">Distance</th>
                                    <th scope="col" style="width:120px;" class="slds-text-align_right">System Price</th>
                                    <th scope="col" style="width:120px;" class="slds-text-align_right">Final Price</th>
                                    <th scope="col" style="width:150px;">Override Reason</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={formattedTrips} for:item="trip">
                                    <tr key={trip.Id}>
                                        <td>{trip.rowNumber}</td>
                                        <td>
                                            <div class="slds-grid slds-grid_vertical-align-center">
                                                <lightning-icon icon-name="standard:shipment" size="xx-small" class="slds-m-right_x-small"></lightning-icon>
                                                <span>{trip.Truck_Type__c}</span>
                                            </div>
                                        </td>
                                        <td class="slds-text-align_right">{trip.formattedDistance} km</td>
                                        <td class="slds-text-align_right slds-text-color_weak">{trip.formattedSystemPrice}</td>
                                        <td class="slds-text-align_right slds-text-title_bold">
                                            <template lwc:if={trip.isOverridden}>
                                                <span class="slds-text-color_error">{trip.formattedFinalPrice}</span>
                                            </template>
                                            <template lwc:else>
                                                {trip.formattedFinalPrice}
                                            </template>
                                        </td>
                                        <td>
                                            <template lwc:if={trip.Override_Reason__c}>
                                                <span class="slds-badge slds-badge_warning">{trip.Override_Reason__c}</span>
                                            </template>
                                            <template lwc:else>
                                                <span class="slds-text-color_weak">—</span>
                                            </template>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                            <tfoot>
                                <tr>
                                    <td colspan="4" class="slds-text-align_right slds-text-title_caps slds-p-right_small">Transport Total</td>
                                    <td class="slds-text-align_right slds-text-heading_small slds-text-title_bold">{formattedTransportTotal}</td>
                                    <td></td>
                                </tr>
                            </tfoot>
                        </table>
                    </template>
                </div>
            </div>
        </template>

        <!-- ═══ Section 4: Opportunity Summary ═══ -->
        <div class="slds-card total-card slds-m-bottom_medium">
            <div class="slds-card__body slds-card__body_inner">
                <lightning-layout vertical-align="center" multiple-rows>
                    <lightning-layout-item flexibility="grow" size="6" medium-device-size="3" class="slds-text-align_center slds-m-bottom_small">
                        <div class="slds-grid slds-grid_vertical">
                            <span class="slds-text-title_caps slds-text-color_weak">Products Total</span>
                            <span class="slds-text-heading_small">{formattedProductsSubtotal}</span>
                        </div>
                    </lightning-layout-item>
                    <lightning-layout-item flexibility="grow" size="6" medium-device-size="3" class="slds-text-align_center slds-m-bottom_small">
                        <div class="slds-grid slds-grid_vertical">
                            <span class="slds-text-title_caps slds-text-color_weak">Transport Cost</span>
                            <span class="slds-text-heading_small">{formattedTransportTotal}</span>
                        </div>
                    </lightning-layout-item>
                    <lightning-layout-item flexibility="grow" size="6" medium-device-size="3" class="slds-text-align_center slds-m-bottom_small">
                        <div class="slds-grid slds-grid_vertical">
                            <span class="slds-text-title_caps slds-text-color_weak"></span>
                            <span class="slds-text-heading_small"></span>
                        </div>
                    </lightning-layout-item>
                    <lightning-layout-item flexibility="grow" size="6" medium-device-size="3" class="slds-text-align_right">
                        <div class="slds-grid slds-grid_vertical">
                            <span class="slds-text-title_caps slds-text-color_weak">Grand Total</span>
                            <span class="slds-text-heading_medium grand-total">{formattedGrandTotal}</span>
                        </div>
                    </lightning-layout-item>
                </lightning-layout>
            </div>
        </div>
    </div>
</template>
