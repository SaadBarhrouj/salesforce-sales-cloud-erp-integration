<template>
    <div class="step-configure slds-p-around_none slds-grid slds-is-relative slds-scrollable_none">
        <div class="step-configure-content slds-col slds-no-space slds-scrollable_y">

            <!-- ── LOADING STATE ────────────────────────────────────────── -->
            <div lwc:if={isLoading} class="slds-is-relative slds-var-p-around_xx-large">
                <lightning-spinner alternative-text="Loading bundle configuration" size="medium"></lightning-spinner>
            </div>

            <!-- ── EMPTY STATE ───────────────────────────────────────────── -->
            <div lwc:if={noBundleSelected}>
                <c-empty-state
                  illustration-name={emptyStateIllustration}
                  title={emptyStateTitle}
                  description={emptyStateDescription}
                  size="large">
                </c-empty-state>
            </div>
            <div lwc:elseif={hasNoFeatures}>
                <c-empty-state
                  illustration-name={emptyStateIllustration}
                  title={emptyStateTitle}
                  description={emptyStateDescription}
                  size="large">
                </c-empty-state>
            </div>

            <!-- ── MAIN CONTENT ──────────────────────────────────────────── -->
            <template lwc:if={hasFeatures}>
                <div class="slds-p-around_medium">

                    <!-- Bundle title -->
                    <h1 class="slds-text-heading_medium slds-truncate slds-m-bottom_small">
                        {bundleName}
                    </h1>

                    <!-- ── SECTIONS VIEW ────────────────────────────────── -->
                    <template lwc:if={isSectionsView}>
                        <div class="slds-m-bottom_large">
                            <template for:each={processedFeatures} for:item="feature">
                                <div key={feature.Id} class="slds-box slds-p-around_none slds-m-bottom_medium slds-theme_default">

                                    <div class="slds-theme_shade slds-p-around_small slds-border_bottom">
                                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-end">

                                            <div class="slds-col slds-text-align_left">
                                                <h3 class="slds-text-heading_small slds-m-bottom_xxx-small" title={feature.Name}>
                                                    {feature.Name}
                                                </h3>
                                                <p lwc:if={feature.helpText} class="slds-text-body_regular slds-text-color_weak">
                                                    {feature.helpText}
                                                </p>
                                            </div>

                                            <div class="slds-col slds-text-align_right">
                                            <span lwc:if={feature.minMaxDisplay} class="slds-text-body_regular slds-text-color_weak">
                                                {feature.minMaxDisplay}
                                            </span>
                                            </div>

                                        </div>
                                    </div>

                                    <div>
                                        <lightning-datatable
                                          key-field="Id"
                                          data-feature-id={feature.Id}
                                          data={feature.options}
                                          columns={columns}
                                          draft-values={feature.draftValues}
                                          onsave={handleSaveTable}
                                          oncancel={handleCancelTable}
                                          max-row-selection={feature.maxOptions}
                                          selected-rows={feature.selectedRows}
                                          disabled-rows={feature.disabledRows}
                                          onrowselection={handleFeatureSelection}>
                                        </lightning-datatable>
                                    </div>

                                </div>
                            </template>
                        </div>
                    </template>
                    <!-- ── TABS VIEW ────────────────────────────────────── -->
                    <template lwc:if={isTabsView}>
                        <lightning-tabset>
                            <template for:each={processedFeatures} for:item="feature">
                                <lightning-tab key={feature.Id} data-feature-id={feature.Id} label={feature.Name}>
                                        <!-- Datatable -->
                                        <lightning-datatable
                                          key-field="Id"
                                          data-feature-id={feature.Id}
                                          data={feature.options}
                                          columns={columns}
                                          draft-values={feature.draftValues}
                                          onsave={handleSaveTable}
                                          oncancel={handleCancelTable}
                                          max-row-selection={feature.maxOptions}
                                          selected-rows={feature.selectedRows}
                                          disabled-rows={feature.disabledRows}
                                          onrowselection={handleFeatureSelection}>
                                        </lightning-datatable>
                                </lightning-tab>
                            </template>
                        </lightning-tabset>
                    </template>

                </div>
            </template>

        </div>

        <section class={filterPanelClass} aria-hidden={filterPanelHidden}>
            <div class="filter-panel__header slds-grid slds-grid_align-spread slds-media_center slds-p-around_medium slds-m-around_none">
                <div>
                    <h2 class="slds-text-heading_small slds-truncate slds-m-around_none" title="Filters">Filters</h2>
                    <p class="slds-m-top_xxx-small slds-text-body_small slds-color__text_gray-9 slds-m-around_none">Code and type</p>
                </div>
                <lightning-button-icon
                    icon-name="utility:close"
                    variant="border-filled"
                    alternative-text="Close filters"
                    title="Close filters"
                    onclick={handleCloseFilterPanel}>
                </lightning-button-icon>
            </div>

            <div class="filter-panel__summary slds-grid slds-wrap" lwc:if={hasActiveFilters}>
                <template for:each={activeFilters} for:item="filter">
                    <lightning-pill
                        key={filter.id}
                        label={filter.label}
                        name={filter.field}
                        onremove={handleRemoveFilter}>
                    </lightning-pill>
                </template>
            </div>

            <div class="filter-panel__body slds-p-around_medium slds-p-top_none">
                <lightning-input
                    label="Product Code"
                    value={pendingFilterProductCode}
                    onchange={handleFilterProductCodeChange}>
                </lightning-input>

                <div class="slds-m-top_small">
                    <lightning-combobox
                        name="optionTypeFilter"
                        label="Option Type"
                        options={optionTypeOptions}
                        value={pendingFilterOptionType}
                        onchange={handleFilterOptionTypeChange}>
                    </lightning-combobox>
                </div>
            </div>

            <div class="filter-panel__footer slds-grid slds-grid_align-end slds-gutters_x-small">
                <lightning-button
                    label="Reset"
                    variant="neutral"
                    onclick={handleResetFilters}>
                </lightning-button>
                <lightning-button
                    class="slds-m-left_small"
                    label="Apply"
                    variant="brand"
                    onclick={handleApplyFilters}>
                </lightning-button>
            </div>
        </section>
    </div>
</template>
