<template>
    <div class="step-configure slds-p-around_none slds-grid slds-is-relative slds-scrollable_none">
        <div class="step-configure-content slds-col slds-no-space slds-scrollable_y">

            <!-- LOADING & EMPTY STATES -->
            <div if:true={isLoading} class="slds-is-relative slds-var-p-around_xx-large">
                <lightning-spinner alternative-text="Loading bundle configuration" size="medium"></lightning-spinner>
            </div>

            <div if:true={hasNoFeatures}>
                <c-empty-state
                  illustration-name={emptyStateIllustration}
                  title="No Configuration Options"
                  description="This bundle has no configurable features."
                  size="large">
                </c-empty-state>
            </div>

            <!-- VIEW MODE TOGGLE + CONTENT -->
            <template if:true={hasFeatures}>
                <div class="slds-p-around_medium">
                    <h1 class="slds-text-heading_medium slds-truncate">
                        {bundleName}
                    </h1>

                    <!-- Toggle Sections/Tabs (2 boutons LWC) -->
                    <div class="slds-m-top_small slds-grid slds-gutters_x-small">
                        <lightning-button
                          label="Sections"
                          variant={sectionsButtonVariant}
                          onclick={switchToSections}
                          class="slds-size_1-of-2">
                        </lightning-button>
                        <lightning-button
                          label="Tabs"
                          variant={tabsButtonVariant}
                          onclick={switchToTabs}
                          class="slds-size_1-of-2">
                        </lightning-button>
                    </div>

                    <!-- SECTIONS VIEW (PAR DÉFAUT) -->
                    <template if:true={isSectionsView}>
                        <div class="slds-box slds-m-bottom_large">
                            <template for:each={processedFeatures} for:item="feature">
                                <section key={feature.Id} class="slds-section">
                                    <div class="slds-section__title slds-theme_shade">
                                        <h3 class="slds-section__title-action slds-truncate" title={feature.Name}>
                                            {feature.Name}
                                            <span class="slds-badge slds-theme_shade slds-m-left_xx-small">
                                                {feature.Min_Options__c}-{feature.Max_Options__c}
                                            </span>
                                        </h3>
                                    </div>
                                    <div class="slds-section__content">
                                        <lightning-datatable
                                          key-field="Id"
                                          data={feature.options}
                                          columns={columns}
                                          draft-values={draftValues}
                                          onsave={handleSaveTable}
                                          max-row-selection={feature.maxSelection}
                                          selected-rows={feature.selectedRows}
                                          onrowselection={handleFeatureSelection}
                                          hide-checkbox-column="false">
                                        </lightning-datatable>
                                    </div>
                                </section>
                            </template>
                        </div>
                    </template>

                    <!-- TABS VIEW -->
                    <template if:true={isTabsView}>
                        <lightning-tabset class="slds-m-bottom_large">
                            <template for:each={processedFeatures} for:item="feature">
                                <lightning-tab key={feature.Id} label={feature.Name}>
                                    <div class="slds-p-around_medium">
                                        <span class="slds-badge slds-theme_shade">
                                            {feature.Min_Options__c}-{feature.Max_Options__c}
                                        </span>
                                        <lightning-datatable
                                          key-field="Id"
                                          data={feature.options}
                                          columns={columns}
                                          draft-values={draftValues}
                                          onsave={handleSaveTable}
                                          max-row-selection={feature.maxSelection}
                                          selected-rows={feature.selectedRows}
                                          onrowselection={handleFeatureSelection}>
                                        </lightning-datatable>
                                    </div>
                                </lightning-tab>
                            </template>
                        </lightning-tabset>
                    </template>
                </div>
            </template>
        </div>
    </div>
</template>
