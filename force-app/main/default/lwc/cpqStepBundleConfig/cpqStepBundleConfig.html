<template>
    <div class="step-configure slds-p-around_none slds-grid slds-is-relative slds-scrollable_none">
        <div class="step-configure-content slds-col slds-no-space slds-scrollable_y">

            <!-- ── LOADING STATE ────────────────────────────────────────── -->
            <div lwc:if={isLoading} class="slds-is-relative slds-var-p-around_xx-large">
                <lightning-spinner alternative-text="Loading bundle configuration" size="medium"></lightning-spinner>
            </div>

            <!-- ── EMPTY STATE ───────────────────────────────────────────── -->
            <div lwc:if= {hasNoFeatures}>
                <c-empty-state
                  illustration-name={emptyStateIllustration}
                  title="No Configuration Options"
                  description="This bundle has no configurable features."
                  size="large">
                </c-empty-state>
            </div>

            <!-- ── MAIN CONTENT ──────────────────────────────────────────── -->
            <template lwc:if={hasFeatures}>
                <div class="slds-p-around_medium">
                    
                    <!-- Bundle title -->
                    <h1 class="slds-text-heading_medium slds-truncate slds-m-bottom_small">
                        {bundleName}
                    </h1>


                    <!-- ── SECTIONS VIEW ────────────────────────────────── -->
                    <template lwc:if={isSectionsView}>
                        <div class="slds-m-bottom_large">
                            <template for:each={processedFeatures} for:item="feature">
                                <div key={feature.Id} class="slds-box slds-p-around_none slds-m-bottom_medium slds-theme_default">
                                    <section data-feature-id={feature.Id} class="slds-section slds-is-open slds-m-bottom_none">
                                        <div class="slds-section__title slds-theme_shade slds-p-around_small">
                                            <span class="slds-truncate slds-text-heading_small slds-text-title_bold slds-text-align_left" title={feature.Name}>
                                                {feature.Name}
                                            </span>
                                        </div>
                                        <div class="slds-section__content slds-p-top_none">
                                            <div class="slds-p-horizontal_medium slds-p-top_medium slds-p-bottom_small slds-text-align_left" if:true={feature.helpText}>
                                                <p class="slds-text-body_regular slds-text-color_weak">{feature.helpText}</p>
                                            </div>
                                            <div class="slds-p-horizontal_medium slds-p-bottom_small slds-text-align_left">
                                                <span class={feature.badgeClass}>
                                                    Min: {feature.minOptions} / Max: {feature.maxOptions}
                                                </span>
                                            </div>
                                            <div class="slds-p-bottom_medium">
                                                <lightning-datatable
                                                  key-field="Id"
                                                  data={feature.options}
                                                  columns={columns}
                                                  draft-values={draftValues}
                                                  onsave={handleSaveTable}
                                                  max-row-selection={feature.maxOptions}
                                                  selected-rows={feature.selectedRows}
                                                  disabled-rows={feature.disabledRows}
                                                  onrowselection={handleFeatureSelection}>
                                                </lightning-datatable>
                                            </div>
                                        </div>
                                    </section>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- ── TABS VIEW ────────────────────────────────────── -->
                    <template lwc:if={isTabsView}>
                        <lightning-tabset class="slds-m-bottom_large">
                            <template for:each={processedFeatures} for:item="feature">
                                <lightning-tab key={feature.Id} data-feature-id={feature.Id} label={feature.Name}>
                                    <div class="slds-p-around_medium">

                                        <!-- Help text (optional) -->
                                        <p lwc:if={feature.helpText}
                                           class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small"
                                           style="text-align: left;">
                                            {feature.helpText}
                                        </p>

                                        <!-- Min / Max badge -->
                                        <div class="slds-m-bottom_small" style="text-align: left;">
                                            <span class={feature.badgeClass}>
                                                Min: {feature.minOptions} &nbsp;|&nbsp; Max: {feature.maxOptions}
                                            </span>
                                        </div>

                                        <!-- Datatable -->
                                        <lightning-datatable
                                          key-field="Id"
                                          data={feature.options}
                                          columns={columns}
                                          draft-values={draftValues}
                                          onsave={handleSaveTable}
                                          max-row-selection={feature.maxOptions}
                                          selected-rows={feature.selectedRows}
                                          disabled-rows={feature.disabledRows}
                                          onrowselection={handleFeatureSelection}>
                                        </lightning-datatable>

                                    </div>
                                </lightning-tab>
                            </template>
                        </lightning-tabset>
                    </template>

                </div>
            </template>

        </div>
    </div>
</template>
